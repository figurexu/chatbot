apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: chatbot
  namespace: chatbot
  labels:
    app: chatbot
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
      - name: chatbot
        image: 192.168.5.61:5000/chatbot:0.1.7
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: chatbot-config
        - secretRef:
            name: chatbot-secret
        # LLM API Key 鐙珛 Secret锛堟湰鍦版墜鍔ㄥ垱寤猴紝涓嶇撼鍏?Argo CD 绠＄悊锛?        - secretRef:
            name: chatbot-llm-secret
        # 璇煶锛堢伀灞卞紩鎿庤眴鍖呰闊筹級API Key 鐙珛 Secret锛堟湰鍦版墜鍔ㄥ垱寤猴級
        - secretRef:
            name: chatbot-voice-secret
        env:
        - name: APP_VERSION
          value: "0.1.7"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 100



