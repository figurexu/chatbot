# 敏感配置。示例环境请勿在生产直接明文存放，建议后续迁移 Sealed Secrets / External Secrets。
# 当前默认 mock 模式，无需 API Key；接入真实 LLM 时填入：
#   CHATBOT_LLM_API_KEY=<你的 Key>
#   CHATBOT_LLM_MODEL=<模型名，如 doubao-seed-1-6-250615 / deepseek-chat>
# 并修改 ConfigMap 中 CHATBOT_LLM_PROVIDER=openai
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secret
  namespace: chatbot
type: Opaque
stringData:
  CHATBOT_DB_USER: "appuser"
  CHATBOT_DB_PASS: "app-pass-2026"
  CHATBOT_LLM_API_KEY: ""
  CHATBOT_LLM_MODEL: ""
