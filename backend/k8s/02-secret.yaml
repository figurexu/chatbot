# 敏感配置。示例环境请勿在生产直接明文存放，建议后续迁移 Sealed Secrets / External Secrets。
# API Key 不提交仓库：请手动在集群创建独立 Secret（Argo CD 不管辖，不会被 selfHeal 覆盖）：
#   kubectl -n chatbot create secret generic chatbot-llm-secret \
#     --from-literal=CHATBOT_LLM_API_KEY=<你的 Key>
# 模型名在此填写（非敏感）：
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secret
  namespace: chatbot
type: Opaque
stringData:
  CHATBOT_DB_USER: "appuser"
  CHATBOT_DB_PASS: "app-pass-2026"
  CHATBOT_LLM_API_KEY: ""
  CHATBOT_LLM_MODEL: "glm-4-flash"
